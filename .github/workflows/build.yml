name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Zip'i aç
        run: unzip -q PCSimulator.zip
      - name: APK derle
        working-directory: PCSimulator
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PCSimulator-apk
          path: PCSimulator/app/build/outputs/apk/debug/app-debug.apk
